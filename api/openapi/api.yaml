info:
  title: title
  description: API docs for title
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        fullName:
          type: string
          example: Иван Иванов
        password:
          type: string
          example: password123
        repeatedPassword:
          type: string
          example: password123
        role:
          type: string
          enum:
            - DRIVER
            - DIRECTOR
          example: DIRECTOR
      required:
        - email
        - fullName
        - password
        - repeatedPassword
        - role
    AuthTokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
      required:
        - accessToken
    BadResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        message:
          type: string
      required:
        - statusCode
        - message
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password123
      required:
        - email
        - password
    UsersResponseDto:
      type: object
      properties:
        id:
          type: string
          example: b3d8e3d6-8a5a-4d6f-a2cb-3af69b83e46a
        email:
          type: string
          example: user@example.com
        fullName:
          type: string
          example: Иван Иванов
        role:
          type: string
          enum:
            - DRIVER
            - DIRECTOR
          example: DIRECTOR
      required:
        - id
        - email
        - fullName
        - role
    CreateTaxiParkDto:
      type: object
      properties:
        name:
          type: string
          example: Таксопарк №1
        address:
          type: string
          example: Москва, ул. Пушкина 1
      required:
        - name
        - address
    UpdateTaxiParkDto:
      type: object
      properties:
        name:
          type: string
          example: Таксопарк №1
        address:
          type: string
          example: Москва, ул. Пушкина 1
    CreateCarDto:
      type: object
      properties:
        firm:
          type: string
          example: Toyota
        model:
          type: string
          example: Camry
        type:
          type: string
          example: SEDAN
        plateNumber:
          type: string
          example: A123BC77
        state:
          type: string
          enum: &a16
            - WORKING
            - EMERGENCY
            - REPAIR
          example: WORKING
      required:
        - firm
        - model
        - type
        - plateNumber
    UpdateCarDto:
      type: object
      properties:
        firm:
          type: string
          example: Toyota
        model:
          type: string
          example: Camry
        type:
          type: string
          example: SEDAN
        plateNumber:
          type: string
          example: A123BC77
        state:
          type: string
          enum: *a16
          example: WORKING
    UpdateCarStateDto:
      type: object
      properties:
        state:
          type: string
          enum:
            - WORKING
            - EMERGENCY
            - REPAIR
          example: REPAIR
      required:
        - state
    UpdateDriverDto:
      type: object
      properties:
        passportNumber:
          type: string
          example: 1234 567890
        experience:
          type: number
          example: 5
    AssignCarDto:
      type: object
      properties:
        carId:
          type: string
          example: car-uuid
      required:
        - carId
    CreateDriverInvitationDto:
      type: object
      properties:
        driverId:
          type: string
          example: driver-uuid
      required:
        - driverId
    CreateWorkDayDto:
      type: object
      properties:
        workDate:
          type: string
          example: 2026-05-02
        revenue:
          type: number
          example: 2500
        carOnLine:
          type: boolean
          example: true
      required:
        - workDate
    UpdateWorkDayDto:
      type: object
      properties:
        workDate:
          type: string
          example: 2026-05-02
        revenue:
          type: number
          example: 2500
        carOnLine:
          type: boolean
          example: true
