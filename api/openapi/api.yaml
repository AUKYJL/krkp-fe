info:
  title: title
  description: API docs for title
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        fullName:
          type: string
          example: Иван Иванов
        password:
          type: string
          example: password123
        repeatedPassword:
          type: string
          example: password123
        role:
          type: string
          enum:
            - DRIVER
            - DIRECTOR
          example: DIRECTOR
      required:
        - email
        - fullName
        - password
        - repeatedPassword
        - role
    AuthTokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
      required:
        - accessToken
    BadResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        message:
          type: string
      required:
        - statusCode
        - message
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password123
      required:
        - email
        - password
    UsersResponseDto:
      type: object
      properties:
        id:
          type: string
          example: b3d8e3d6-8a5a-4d6f-a2cb-3af69b83e46a
        email:
          type: string
          example: user@example.com
        fullName:
          type: string
          example: Иван Иванов
        role:
          type: string
          enum:
            - DRIVER
            - DIRECTOR
          example: DIRECTOR
      required:
        - id
        - email
        - fullName
        - role
    CreateTaxiParkDto:
      type: object
      properties:
        name:
          type: string
          example: Таксопарк №1
        address:
          type: string
          example: Москва, ул. Пушкина 1
      required:
        - name
        - address
    TaxiParksAnalyticsPeriodDto:
      type: object
      properties:
        from:
          type: string
          example: 2025-04-01
        to:
          type: string
          example: 2025-04-30
        daysCount:
          type: number
          example: 30
      required:
        - from
        - to
        - daysCount
    TaxiParksAnalyticsSummaryDto:
